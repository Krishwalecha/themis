    <!-- the same story in plain HTML, for crawlers and readers without JavaScript -->
    <noscript>
      <main style="max-width: 720px; margin: 64px auto; padding: 0 24px; font-family: system-ui, sans-serif; color: #efebe2; background: #0a0a09">
        <h1>Themis: API testing, API monitoring and API contract validation</h1>
        <p>
          Themis is a free, self-hostable API workspace. Send and test API requests with environments and variables, group them into collections, monitor endpoints on a
          schedule, and validate every response against OpenAPI or JSON Schema contracts. When something breaks, Themis explains what failed and how to fix it.
        </p>
        <h2>Features</h2>
        <ul>
          <li>API testing workspace: params, headers, auth, JSON, form and file bodies, with a pass or fail verdict for every response</li>
          <li>Collections with request chaining; import from curl, Postman collections and OpenAPI files</li>
          <li>API monitoring: schedules, incidents, Slack and Discord alerts, maintenance windows and public status pages</li>
          <li>API contract validation with OpenAPI 3 and JSON Schema, version history and breaking change detection</li>
          <li>AI summaries of failures, and a CLI for CI pipelines</li>
        </ul>
        <p><a href="/signup">Create a free account</a> · <a href="https://github.com/Krishwalecha/themis">Source on GitHub</a></p>
